<circle cx="46.0" cy="480" r="7" fill="#f6b042"/>
<text class="t" x="64.0" y="485">Browse every device</text>
<text class="b" x="42.0" y="518">Each device lends its folders.</text>
<text class="b" x="42.0" y="540">The others see them at once.</text>
<rect class="boxd" x="406.6666666666667" y="450" width="366.6666666666667" height="112" rx="6"/>
<circle cx="432.6666666666667" cy="480" r="7" fill="#e8833a"/>
<text class="t" x="450.6666666666667" y="485">Bytes move on demand</text>
<text class="b" x="428.6666666666667" y="518">Only the list travels ahead;</text>
<text class="b" x="428.6666666666667" y="540">a file comes when you open it.</text>
<rect class="boxd" x="793.3333333333334" y="450" width="366.6666666666667" height="112" rx="6"/>
<circle cx="819.3333333333334" cy="480" r="7" fill="#5ce1e6"/>
<text class="t" x="837.3333333333334" y="485">No cloud in between</text>
<text class="b" x="815.3333333333334" y="518">Devices talk directly, encrypted,</text>
<text class="b" x="815.3333333333334" y="540">and relay for each other.</text>
