<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 582" role="img" aria-labelledby="t">
<title id="t">Four devices in one swarm: a phone sharing Camera and WhatsApp, a laptop sharing Documents, a desktop sharing Music and Projects and a home server sharing Movies, connected directly and encrypted. Every device can browse the others' folders, read-only, and all of them read and write one swarm folder whose edits merge everywhere.</title>
