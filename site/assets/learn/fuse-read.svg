<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" role="img" aria-labelledby="t">
<title id="t">The FUSE read path: a program&#x27;s read goes through the kernel to /dev/fuse, NomadFS answers it by loading only the blocks it needs from the local store or from the device that has them</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 19px; font-weight: 600; fill: #f5efe6; }
.b { font-size: 16.5px; }
.s { font-size: 15px; fill: #a99f8f; }
.k { font-size: 13px; letter-spacing: 1.6px; fill: #f6b042; }
.ko { font-size: 13px; letter-spacing: 1.6px; fill: #5ce1e6; }
.am { fill: #f6b042; } .oa { fill: #5ce1e6; } .di { fill: #a99f8f; } .du { fill: #6f6a63; } .cr { fill: #f5efe6; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxa { fill: #f6b042; fill-opacity: .1; stroke: #f6b042; stroke-width: 1.6; }
.boxo { fill: #2ec4b6; fill-opacity: .1; stroke: #5ce1e6; stroke-width: 1.6; }
.boxt { fill: #e8833a; fill-opacity: .14; stroke: #e8833a; stroke-width: 1.6; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; stroke-dasharray: 5 5; }
.ln { stroke: #a99f8f; stroke-width: 1.6; fill: none; }
.lna { stroke: #f6b042; stroke-width: 1.8; fill: none; }
.lno { stroke: #5ce1e6; stroke-width: 1.8; fill: none; }
.lnf { stroke: #f2e8d8; stroke-opacity: .18; stroke-width: 1.3; fill: none; }
.dash { stroke-dasharray: 5 5; }
.dot { stroke-dasharray: 1.5 5; stroke-linecap: round; }
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a99f8f"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f6b042"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5ce1e6"/></marker>
</defs>
<rect class="box" x="20" y="18" width="560" height="62" rx="6"/>
<text class="k" x="40" y="44">A PROGRAM</text>
<text class="b" x="40" y="68">cat ~/NomadFS/Laptop/Photos/a.txt</text>
<path class="ln" d="M300 80 L300 110" marker-end="url(#ar)"/>
<text class="s" x="312" y="101">read()</text>
<rect class="box" x="20" y="114" width="560" height="62" rx="6"/>
<text class="k" x="40" y="140">LINUX KERNEL</text>
<text class="b" x="40" y="164">VFS → fuse module</text>
<path class="lno" d="M270 176 L270 222" marker-end="url(#aro)"/>
<path class="lno" d="M330 222 L330 176" marker-end="url(#aro)"/>
<text class="s oa" x="344" y="206">/dev/fuse</text>
<text class="s" x="256" y="206" text-anchor="end">request</text>
<rect class="boxa" x="20" y="226" width="560" height="112" rx="6"/>
<text class="k" x="40" y="252">NOMADFS · ONE LOOP</text>
<text class="b" x="40" y="280">read a request, handle it,</text>
<text class="b" x="40" y="304">write the reply</text>
<text class="s" x="40" y="328">LOOKUP · GETATTR · READDIR · READ …</text>
<path class="ln" d="M300 338 L300 368" marker-end="url(#ar)"/>
<text class="s" x="312" y="359">tree.readAt</text>
<rect class="box" x="20" y="372" width="258" height="84" rx="6"/>
<text class="b" x="149" y="404" text-anchor="middle">local store</text>
<text class="s" x="149" y="428" text-anchor="middle">cached blocks</text>
<rect class="boxo" x="322" y="372" width="258" height="84" rx="6"/>
<text class="b" x="451" y="404" text-anchor="middle">GET_BLOCK</text>
<text class="s" x="451" y="428" text-anchor="middle">to the device</text>
<text class="s" x="300" y="420" text-anchor="middle">or</text>
<rect class="boxd" x="20" y="484" width="560" height="140" rx="6"/>
<text class="k" x="40" y="512">MOUNTING, ONCE</text>
<text class="s" x="40" y="542">fusermount3 opens /dev/fuse</text>
<text class="s" x="40" y="566">and mounts it, then hands the fd</text>
<text class="s" x="40" y="590">back over a socketpair</text>
<text class="s am" x="40" y="614">(_FUSE_COMMFD) · no libfuse</text>
</svg>
