<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 556" role="img" aria-labelledby="t">
<title id="t">Fixed-size chunks versus FastCDC: inserting a few bytes near the start changes every fixed-size chunk after it, but only the one content-defined chunk that holds the insertion</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 19px; font-weight: 600; fill: #f5efe6; }
.b { font-size: 16.5px; }
.s { font-size: 15px; fill: #a99f8f; }
.k { font-size: 13px; letter-spacing: 1.6px; fill: #f6b042; }
.ko { font-size: 13px; letter-spacing: 1.6px; fill: #5ce1e6; }
.am { fill: #f6b042; } .oa { fill: #5ce1e6; } .di { fill: #a99f8f; } .du { fill: #6f6a63; } .cr { fill: #f5efe6; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxa { fill: #f6b042; fill-opacity: .1; stroke: #f6b042; stroke-width: 1.6; }
.boxo { fill: #2ec4b6; fill-opacity: .1; stroke: #5ce1e6; stroke-width: 1.6; }
.boxt { fill: #e8833a; fill-opacity: .14; stroke: #e8833a; stroke-width: 1.6; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; stroke-dasharray: 5 5; }
.ln { stroke: #a99f8f; stroke-width: 1.6; fill: none; }
.lna { stroke: #f6b042; stroke-width: 1.8; fill: none; }
.lno { stroke: #5ce1e6; stroke-width: 1.8; fill: none; }
.lnf { stroke: #f2e8d8; stroke-opacity: .18; stroke-width: 1.3; fill: none; }
.dash { stroke-dasharray: 5 5; }
.dot { stroke-dasharray: 1.5 5; stroke-linecap: round; }
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a99f8f"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f6b042"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5ce1e6"/></marker>
</defs>
<text class="k" x="20" y="30">FIXED-SIZE CHUNKS</text>
<text class="s" x="20" y="71">before</text>
<rect class="box" x="96" y="44" width="76" height="40" rx="3"/>
<text class="b" x="134.0" y="70" text-anchor="middle">A</text>
<rect class="box" x="176" y="44" width="76" height="40" rx="3"/>
<text class="b" x="214.0" y="70" text-anchor="middle">B</text>
<rect class="box" x="256" y="44" width="76" height="40" rx="3"/>
<text class="b" x="294.0" y="70" text-anchor="middle">C</text>
<rect class="box" x="336" y="44" width="76" height="40" rx="3"/>
<text class="b" x="374.0" y="70" text-anchor="middle">D</text>
<rect class="box" x="416" y="44" width="76" height="40" rx="3"/>
<text class="b" x="454.0" y="70" text-anchor="middle">E</text>
<rect class="box" x="496" y="44" width="76" height="40" rx="3"/>
<text class="b" x="534.0" y="70" text-anchor="middle">F</text>
<text class="s" x="20" y="123">after</text>
<rect class="box" x="96" y="96" width="76" height="40" rx="3"/>
<text class="b" x="134.0" y="122" text-anchor="middle">A</text>
<rect class="boxa" x="176" y="96" width="76" height="40" rx="3"/>
<text class="b" x="214.0" y="122" text-anchor="middle">B&#x27;</text>
<rect class="boxa" x="256" y="96" width="76" height="40" rx="3"/>
<text class="b" x="294.0" y="122" text-anchor="middle">C&#x27;</text>
<rect class="boxa" x="336" y="96" width="76" height="40" rx="3"/>
<text class="b" x="374.0" y="122" text-anchor="middle">D&#x27;</text>
<rect class="boxa" x="416" y="96" width="76" height="40" rx="3"/>
<text class="b" x="454.0" y="122" text-anchor="middle">E&#x27;</text>
<rect class="boxa" x="496" y="96" width="76" height="40" rx="3"/>
<text class="b" x="534.0" y="122" text-anchor="middle">F&#x27;</text>
<rect class="boxa" x="576" y="96" width="14" height="40" rx="3"/>
<text class="s am" x="176" y="92" text-anchor="middle">▼</text>
<text class="s am" x="20" y="168">one insertion: 5 of 6 chunks change</text>
<text class="k" x="20" y="222">CONTENT-DEFINED CHUNKS (FASTCDC)</text>
<text class="s" x="20" y="263">before</text>
<rect class="box" x="96" y="236" width="66" height="40" rx="3"/>
<text class="b" x="129.0" y="262" text-anchor="middle">A</text>
<rect class="box" x="166" y="236" width="108" height="40" rx="3"/>
<text class="b" x="220.0" y="262" text-anchor="middle">B</text>
<rect class="box" x="278" y="236" width="56" height="40" rx="3"/>
<text class="b" x="306.0" y="262" text-anchor="middle">C</text>
<rect class="box" x="338" y="236" width="94" height="40" rx="3"/>
<text class="b" x="385.0" y="262" text-anchor="middle">D</text>
<rect class="box" x="436" y="236" width="82" height="40" rx="3"/>
<text class="b" x="477.0" y="262" text-anchor="middle">E</text>
<rect class="box" x="522" y="236" width="50" height="40" rx="3"/>
<text class="b" x="547.0" y="262" text-anchor="middle">F</text>
<text class="s" x="20" y="315">after</text>
<rect class="box" x="96" y="288" width="66" height="40" rx="3"/>
<text class="b" x="129.0" y="314" text-anchor="middle">A</text>
<rect class="boxa" x="166" y="288" width="120" height="40" rx="3"/>
<text class="b" x="226.0" y="314" text-anchor="middle">B&#x27;</text>
<rect class="box" x="290" y="288" width="56" height="40" rx="3"/>
<text class="b" x="318.0" y="314" text-anchor="middle">C</text>
<rect class="box" x="350" y="288" width="94" height="40" rx="3"/>
<text class="b" x="397.0" y="314" text-anchor="middle">D</text>
<rect class="box" x="448" y="288" width="82" height="40" rx="3"/>
<text class="b" x="489.0" y="314" text-anchor="middle">E</text>
<rect class="box" x="534" y="288" width="50" height="40" rx="3"/>
<text class="b" x="559.0" y="314" text-anchor="middle">F</text>
<text class="s am" x="196" y="284" text-anchor="middle">▼</text>
<text class="s am" x="20" y="360">one insertion: 1 chunk changes</text>
<text class="s" x="20" y="382">the others keep their names</text>
<rect class="box" x="20" y="410" width="560" height="130" rx="6"/>
<text class="k" x="40" y="436">WHERE FASTCDC CUTS</text>
<text class="s" x="40" y="464">a 64-bit gear hash rolls over the bytes;</text>
<text class="s" x="40" y="486">cut where hash &amp; mask == 0</text>
<text class="b" x="40" y="516">min 64 KiB · aim 256 KiB · max 1 MiB</text>
</svg>
