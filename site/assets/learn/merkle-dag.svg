<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="t">
<title id="t">A directory block lists beach.jpg; its file DAG is one parent block linking four leaves with their sizes; reading offset 600000 skips the first two links by size and loads only leaf 3</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 19px; font-weight: 600; fill: #f5efe6; }
.b { font-size: 16.5px; }
.s { font-size: 15px; fill: #a99f8f; }
.k { font-size: 13px; letter-spacing: 1.6px; fill: #f6b042; }
.ko { font-size: 13px; letter-spacing: 1.6px; fill: #5ce1e6; }
.am { fill: #f6b042; } .oa { fill: #5ce1e6; } .di { fill: #a99f8f; } .du { fill: #6f6a63; } .cr { fill: #f5efe6; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxa { fill: #f6b042; fill-opacity: .1; stroke: #f6b042; stroke-width: 1.6; }
.boxo { fill: #2ec4b6; fill-opacity: .1; stroke: #5ce1e6; stroke-width: 1.6; }
.boxt { fill: #e8833a; fill-opacity: .14; stroke: #e8833a; stroke-width: 1.6; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; stroke-dasharray: 5 5; }
.ln { stroke: #a99f8f; stroke-width: 1.6; fill: none; }
.lna { stroke: #f6b042; stroke-width: 1.8; fill: none; }
.lno { stroke: #5ce1e6; stroke-width: 1.8; fill: none; }
.lnf { stroke: #f2e8d8; stroke-opacity: .18; stroke-width: 1.3; fill: none; }
.dash { stroke-dasharray: 5 5; }
.dot { stroke-dasharray: 1.5 5; stroke-linecap: round; }
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a99f8f"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f6b042"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5ce1e6"/></marker>
</defs>
<rect class="box" x="20" y="18" width="560" height="118" rx="6"/>
<text class="k" x="40" y="44">DIR BLOCK · Photos/</text>
<text class="b" x="40" y="76">2025/</text>
<text class="s" x="200" y="76">dir</text>
<text class="s" x="560" y="76" text-anchor="end">→ dir block</text>
<rect class="boxa" x="30" y="90" width="540" height="36" rx="4"/>
<text class="b" x="40" y="114">beach.jpg</text>
<text class="s" x="200" y="114">file · 1 MiB</text>
<text class="s am" x="560" y="114" text-anchor="end">→ file root</text>
<path class="lna" d="M300 126 L300 166" marker-end="url(#ara)"/>
<rect class="box" x="20" y="170" width="560" height="108" rx="6"/>
<text class="k" x="40" y="196">PARENT · links with subtree sizes</text>
<rect class="box" x="32" y="210" width="128" height="56" rx="4"/>
<text class="b" x="96" y="236" text-anchor="middle">246 784</text>
<text class="s" x="96" y="256" text-anchor="middle">skip</text>
<rect class="box" x="168" y="210" width="128" height="56" rx="4"/>
<text class="b" x="232" y="236" text-anchor="middle">317 440</text>
<text class="s" x="232" y="256" text-anchor="middle">skip</text>
<rect class="boxa" x="304" y="210" width="128" height="56" rx="4"/>
<text class="b" x="368" y="236" text-anchor="middle">202 752</text>
<text class="s am" x="368" y="256" text-anchor="middle">read</text>
<rect class="box" x="440" y="210" width="128" height="56" rx="4"/>
<text class="b" x="504" y="236" text-anchor="middle">281 600</text>
<text class="s" x="504" y="256" text-anchor="middle"></text>
<path class="lnf" d="M96 278 L96 324"/>
<rect class="box" x="36" y="328" width="120" height="56" rx="4"/>
<text class="b" x="96" y="352" text-anchor="middle">leaf 1</text>
<text class="s" x="96" y="374" text-anchor="middle">0x00+bytes</text>
<path class="lnf" d="M232 278 L232 324"/>
<rect class="box" x="172" y="328" width="120" height="56" rx="4"/>
<text class="b" x="232" y="352" text-anchor="middle">leaf 2</text>
<text class="s" x="232" y="374" text-anchor="middle">0x00+bytes</text>
<path class="lna" d="M368 278 L368 324" marker-end="url(#ara)"/>
<rect class="boxa" x="308" y="328" width="120" height="56" rx="4"/>
<text class="b" x="368" y="352" text-anchor="middle">leaf 3</text>
<text class="s" x="368" y="374" text-anchor="middle">0x00+bytes</text>
<path class="lnf" d="M504 278 L504 324"/>
<rect class="box" x="444" y="328" width="120" height="56" rx="4"/>
<text class="b" x="504" y="352" text-anchor="middle">leaf 4</text>
<text class="s" x="504" y="374" text-anchor="middle">0x00+bytes</text>
<rect class="boxd" x="20" y="410" width="560" height="176" rx="6"/>
<text class="h" x="40" y="438">readAt(offset 600 000)</text>
<text class="s" x="40" y="470">600 000 − 246 784 = 353 216</text>
<text class="s" x="40" y="494">353 216 − 317 440 =  35 776</text>
<text class="s" x="40" y="518">35 776 &lt; 202 752 → leaf 3</text>
<text class="b am" x="40" y="552">loads 2 blocks: parent + leaf 3</text>
<text class="s" x="40" y="576">(1 MiB file, 4 chunks)</text>
</svg>
