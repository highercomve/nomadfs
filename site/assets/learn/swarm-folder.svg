<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1420" role="img" aria-labelledby="t">
<title id="t">The swarm folder: four devices share one list of files. Each file is stored on the device that added it, on one more device and on the backup server. A device that opens a file it doesn't have pulls it from every device that has a copy at once.</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 18px; font-weight: 600; fill: #f5efe6; }
.f { font-size: 15px; }
.fd { font-size: 15px; fill: #a99f8f; }
.s { font-size: 12.5px; fill: #a99f8f; }
.b { font-size: 13px; }
.t { font-size: 15px; font-weight: 600; fill: #f5efe6; }
.k { font-size: 13px; letter-spacing: 1.6px; fill: #f6b042; }
.tag { font-size: 11.5px; font-weight: 600; letter-spacing: .6px; }
.cp { fill: #5ce1e6; } .or { fill: #f6b042; }
.n { font-size: 14px; font-weight: 700; fill: #0b0e16; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxo { fill: #2ec4b6; fill-opacity: .08; stroke: #5ce1e6; stroke-width: 1.8; }
.boxa { fill: #f6b042; fill-opacity: .07; stroke: #f6b042; stroke-width: 1.8; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; }
.ic { fill: none; stroke: #f2e8d8; stroke-width: 2.2; stroke-linejoin: round; }
.sync { stroke: #a99f8f; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
.copy { stroke: #5ce1e6; stroke-width: 3; fill: none; }
.pull { stroke: #e8833a; stroke-width: 3; fill: none; }
.rule { stroke: #f2e8d8; stroke-opacity: .12; stroke-width: 1.2; }
</style>
<marker id="mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ce1e6"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8833a"/></marker>
<g id="on"><circle r="8" fill="#2ec4b6"/><path d="M-3.6,0 L-1,2.8 L3.8,-2.8" stroke="#0b0e16" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="off"><circle r="7" fill="none" stroke="#a99f8f" stroke-width="2" stroke-dasharray="2.6 2.6"/></g>
<g id="ph"><rect x="-9" y="-7.5" width="18" height="15" rx="2.5" fill="none" stroke="#5ce1e6" stroke-width="1.6"/><path d="M-6,5 L-2,0 L1,3 L3.5,1 L6.5,5 z" fill="#5ce1e6"/></g>
<g id="vi"><rect x="-9" y="-7.5" width="18" height="15" rx="2.5" fill="none" stroke="#e8833a" stroke-width="1.6"/><path d="M-2.5,-3.5 L3.5,0 L-2.5,3.5 z" fill="#e8833a"/></g>
<g id="no"><path d="M-7,-8.5 H3 L7,-4.5 V8.5 H-7 z" fill="none" stroke="#f6b042" stroke-width="1.6" stroke-linejoin="round"/><path d="M-3.5,-1 H4 M-3.5,2.5 H4 M-3.5,6 H1.5" stroke="#f6b042" stroke-width="1.3"/></g>
</defs>

<!-- sync lines: every device keeps the whole list -->
<path class="sync" d="M250,252 V298 M510,252 V298 M250,572 V618 M510,572 V618"/>

<!-- (2) the photo is copied from the phone to the laptop -->
<path class="copy" d="M352,135 H404" marker-end="url(#mc)"/>
<circle cx="380" cy="108" r="13" fill="#5ce1e6"/><text class="n" x="380" y="113" text-anchor="middle">2</text>

<!-- (3) opening the video on the phone pulls it from the desktop and the backup at once -->
<path class="pull" d="M50,618 V258" marker-end="url(#mp)"/>
<path class="pull" d="M450,618 V596 H110 V258" marker-end="url(#mp)"/>
<circle cx="80" cy="436" r="13" fill="#e8833a"/><text class="n" x="80" y="441" text-anchor="middle">3</text>

<!-- Phone -->
<rect class="box" x="20" y="20" width="330" height="230" rx="8"/>
<rect class="ic" x="36" y="38" width="20" height="34" rx="4"/><circle cx="46" cy="66" r="1.8" fill="#f2e8d8"/>
<text class="h" x="70" y="56">Phone</text>
<text class="s" x="70" y="78">keeps only its own files</text>
<use href="#on" x="44" y="128"/><use href="#ph" x="72" y="128"/><text class="f" x="92" y="133">holiday.jpg</text><text class="tag or" x="334" y="132" text-anchor="end">ORIGINAL</text>
<use href="#off" x="44" y="170"/><use href="#vi" x="72" y="170"/><text class="fd" x="92" y="175">birthday.mp4</text>
<use href="#off" x="44" y="212"/><use href="#no" x="72" y="212"/><text class="fd" x="92" y="217">notes.md</text>

<!-- Laptop -->
<rect class="box" x="410" y="20" width="330" height="230" rx="8"/>
<rect class="ic" x="430" y="42" width="30" height="21" rx="3"/><path d="M424,68 H466 L462,73 H428 z" fill="#f2e8d8"/>
<text class="h" x="480" y="56">Laptop</text>
<text class="s" x="480" y="78">keeps copies for others</text>
<use href="#on" x="434" y="128"/><use href="#ph" x="462" y="128"/><text class="f" x="482" y="133">holiday.jpg</text><text class="tag cp" x="724" y="132" text-anchor="end">COPY</text>
<use href="#off" x="434" y="170"/><use href="#vi" x="462" y="170"/><text class="fd" x="482" y="175">birthday.mp4</text>
<use href="#on" x="434" y="212"/><use href="#no" x="462" y="212"/><text class="f" x="482" y="217">notes.md</text><text class="tag or" x="724" y="216" text-anchor="end">ORIGINAL</text>

<!-- Swarm folder -->
<rect class="boxa" x="150" y="300" width="460" height="270" rx="8"/>
<path d="M172,324 h15 l5,6 h22 a3,3 0 0 1 3,3 v19 a3,3 0 0 1 -3,3 h-42 a3,3 0 0 1 -3,-3 v-25 a3,3 0 0 1 3,-3 z" fill="#f6b042"/>
<text class="h" x="230" y="340">Swarm folder</text>
<text class="s" x="230" y="362">every device sees the same list</text>
<line class="rule" x1="170" y1="384" x2="590" y2="384"/>
<use href="#ph" x="182" y="414"/><text class="f" x="202" y="419">holiday.jpg</text><text class="s" x="590" y="418" text-anchor="end">from the phone</text>
<use href="#vi" x="182" y="456"/><text class="f" x="202" y="461">birthday.mp4</text><text class="s" x="590" y="460" text-anchor="end">from the desktop</text>
<use href="#no" x="182" y="498"/><text class="f" x="202" y="503">notes.md</text><text class="s" x="590" y="502" text-anchor="end">from the laptop</text>
<line class="rule" x1="170" y1="524" x2="590" y2="524"/>
<circle cx="184" cy="547" r="11" fill="#f6b042"/><text class="n" x="184" y="552" text-anchor="middle" style="font-size:12.5px">1</text>
<text class="s" x="204" y="551" style="fill:#f2e8d8">add, rename, delete: every list updates</text>

<!-- Desktop -->
<rect class="box" x="20" y="620" width="330" height="230" rx="8"/>
<rect class="ic" x="34" y="640" width="30" height="22" rx="3"/><path d="M49,662 v6 M41,670 h16" class="ic"/>
<text class="h" x="80" y="656">Desktop</text>
<text class="s" x="80" y="678">keeps copies for others</text>
<use href="#off" x="44" y="728"/><use href="#ph" x="72" y="728"/><text class="fd" x="92" y="733">holiday.jpg</text>
<use href="#on" x="44" y="770"/><use href="#vi" x="72" y="770"/><text class="f" x="92" y="775">birthday.mp4</text><text class="tag or" x="334" y="774" text-anchor="end">ORIGINAL</text>
<use href="#on" x="44" y="812"/><use href="#no" x="72" y="812"/><text class="f" x="92" y="817">notes.md</text><text class="tag cp" x="334" y="816" text-anchor="end">COPY</text>

<!-- Backup server -->
<rect class="boxo" x="410" y="620" width="330" height="230" rx="8"/>
<rect class="ic" x="428" y="638" width="32" height="13" rx="2"/><rect class="ic" x="428" y="655" width="32" height="13" rx="2"/>
<circle cx="453" cy="644.5" r="1.8" fill="#5ce1e6"/><circle cx="453" cy="661.5" r="1.8" fill="#5ce1e6"/>
<text class="h" x="476" y="656">Backup server</text>
<text class="s" x="476" y="678" style="fill:#5ce1e6">keeps a copy of everything</text>
<use href="#on" x="434" y="728"/><use href="#ph" x="462" y="728"/><text class="f" x="482" y="733">holiday.jpg</text><text class="tag cp" x="724" y="732" text-anchor="end">COPY</text>
<use href="#on" x="434" y="770"/><use href="#vi" x="462" y="770"/><text class="f" x="482" y="775">birthday.mp4</text><text class="tag cp" x="724" y="774" text-anchor="end">COPY</text>
<use href="#on" x="434" y="812"/><use href="#no" x="462" y="812"/><text class="f" x="482" y="817">notes.md</text><text class="tag cp" x="724" y="816" text-anchor="end">COPY</text>

<!-- Step by step -->
<text class="k" x="20" y="900">STEP BY STEP</text>
<rect class="boxd" x="20" y="916" width="355" height="122" rx="6"/>
<circle cx="44" cy="942" r="13" fill="#f6b042"/><text class="n" x="44" y="947" text-anchor="middle">1</text>
<text class="t" x="66" y="947">You add a photo</text>
<text class="b" x="36" y="980">Take a photo on the phone.</text>
<text class="b" x="36" y="1001">Seconds later it is in the</text>
<text class="b" x="36" y="1022">list on every device.</text>

<rect class="boxd" x="385" y="916" width="355" height="122" rx="6"/>
<circle cx="409" cy="942" r="13" fill="#5ce1e6"/><text class="n" x="409" y="947" text-anchor="middle">2</text>
<text class="t" x="431" y="947">Copies made for you</text>
<text class="b" x="401" y="980">Another device keeps a copy</text>
<text class="b" x="401" y="1001">(you pick how many) and the</text>
<text class="b" x="401" y="1022">backup server keeps it all.</text>

<rect class="boxd" x="20" y="1048" width="355" height="122" rx="6"/>
<circle cx="44" cy="1074" r="13" fill="#e8833a"/><text class="n" x="44" y="1079" text-anchor="middle">3</text>
<text class="t" x="66" y="1079">Open what you lack</text>
<text class="b" x="36" y="1112">Opening it pulls pieces from</text>
<text class="b" x="36" y="1133">every device with a copy at</text>
<text class="b" x="36" y="1154">once: the desktop and backup.</text>

<rect class="boxd" x="385" y="1048" width="355" height="122" rx="6"/>
<circle cx="409" cy="1074" r="13" fill="#f2e8d8"/><text class="n" x="409" y="1079" text-anchor="middle">4</text>
<text class="t" x="431" y="1079">Nothing is lost</text>
<text class="b" x="401" y="1112">If a device is off, broken</text>
<text class="b" x="401" y="1133">or lost, its files are still</text>
<text class="b" x="401" y="1154">on the other devices.</text>

<!-- Legend -->
<text class="k" x="20" y="1218">LEGEND</text>
<rect class="boxd" x="20" y="1234" width="720" height="170" rx="6"/>
<use href="#on" x="44" y="1264"/><text class="b" x="64" y="1269">stored on this device</text>
<use href="#off" x="44" y="1296"/><text class="b" x="64" y="1301">only in the list</text>
<path class="sync" d="M34,1328 H56"/><text class="b" x="64" y="1333">the list syncs</text>
<text class="tag cp" x="36" y="1364">COPY</text><text class="b" x="78" y="1365">kept for another</text>
<text class="tag or" x="36" y="1394">ORIGINAL</text><text class="b" x="108" y="1395">added here</text>

<path class="copy" d="M300,1264 H332" marker-end="url(#mc)"/><text class="b" x="344" y="1269">automatic copy, for backup</text>
<path class="pull" d="M300,1296 H332" marker-end="url(#mp)"/><text class="b" x="344" y="1301">pulled from all copies at once</text>
<rect x="308" y="1324" width="14" height="11" rx="2" fill="#f2e8d8"/><path d="M311,1324 v-3.5 a4,4 0 0 1 8,0 v3.5" stroke="#f2e8d8" stroke-width="2" fill="none"/>
<text class="b" x="344" y="1333">encrypted between devices</text>
<circle cx="315" cy="1360" r="8" fill="none" stroke="#f2e8d8" stroke-width="2"/><path d="M309.5,1354.5 l11,11" stroke="#f2e8d8" stroke-width="2"/>
<text class="b" x="344" y="1365">no central server, no cloud</text>
<path d="M305,1398 l6,-11 l6,11 z M313,1398 l6,-11 l6,11 z" fill="#f6b042"/>
<text class="b" x="344" y="1395">two edits at once: both kept</text>
</svg>
