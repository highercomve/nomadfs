<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 660" role="img" aria-labelledby="t">
<title id="t">Two devices edit notes.md at the same time; after they exchange manifests both keep both versions: the higher version keeps the name and the other becomes notes (conflict from Laptop).md</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 19px; font-weight: 600; fill: #f5efe6; }
.b { font-size: 16.5px; }
.s { font-size: 15px; fill: #a99f8f; }
.k { font-size: 13px; letter-spacing: 1.6px; fill: #f6b042; }
.ko { font-size: 13px; letter-spacing: 1.6px; fill: #5ce1e6; }
.am { fill: #f6b042; } .oa { fill: #5ce1e6; } .di { fill: #a99f8f; } .du { fill: #6f6a63; } .cr { fill: #f5efe6; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxa { fill: #f6b042; fill-opacity: .1; stroke: #f6b042; stroke-width: 1.6; }
.boxo { fill: #2ec4b6; fill-opacity: .1; stroke: #5ce1e6; stroke-width: 1.6; }
.boxt { fill: #e8833a; fill-opacity: .14; stroke: #e8833a; stroke-width: 1.6; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; stroke-dasharray: 5 5; }
.ln { stroke: #a99f8f; stroke-width: 1.6; fill: none; }
.lna { stroke: #f6b042; stroke-width: 1.8; fill: none; }
.lno { stroke: #5ce1e6; stroke-width: 1.8; fill: none; }
.lnf { stroke: #f2e8d8; stroke-opacity: .18; stroke-width: 1.3; fill: none; }
.dash { stroke-dasharray: 5 5; }
.dot { stroke-dasharray: 1.5 5; stroke-linecap: round; }
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a99f8f"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f6b042"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5ce1e6"/></marker>
</defs>
<rect class="box" x="30" y="18" width="240" height="52" rx="6"/>
<text class="h" x="150" y="51" text-anchor="middle">Laptop (L)</text>
<rect class="box" x="330" y="18" width="240" height="52" rx="6"/>
<text class="h" x="450" y="51" text-anchor="middle">Phone (P)</text>
<path class="lnf dash" d="M150 70 L150 410"/>
<path class="lnf dash" d="M450 70 L450 410"/>
<rect class="box" x="25" y="90" width="250" height="58" rx="4"/>
<text class="b" x="150" y="115" text-anchor="middle">notes.md (3, L)</text>
<text class="s" x="150" y="137" text-anchor="middle">synced</text>
<rect class="box" x="325" y="90" width="250" height="58" rx="4"/>
<text class="b" x="450" y="115" text-anchor="middle">notes.md (3, L)</text>
<text class="s" x="450" y="137" text-anchor="middle">synced</text>
<rect class="boxa" x="25" y="186" width="250" height="58" rx="4"/>
<text class="b" x="150" y="211" text-anchor="middle">notes.md (4, L)</text>
<text class="s" x="150" y="233" text-anchor="middle">replaced (3, L)</text>
<rect class="boxo" x="325" y="186" width="250" height="58" rx="4"/>
<text class="b" x="450" y="211" text-anchor="middle">notes.md (4, P)</text>
<text class="s" x="450" y="233" text-anchor="middle">replaced (3, L)</text>
<text class="s" x="300" y="172" text-anchor="middle">both edit while apart</text>
<path class="ln dash" d="M150 266 L444 336" marker-end="url(#ar)"/>
<path class="ln dash" d="M450 266 L156 336" marker-end="url(#ar)"/>
<text class="s" x="300" y="362" text-anchor="middle">GET_SWARM, every 10 s</text>
<rect class="box" x="20" y="414" width="560" height="72" rx="6"/>
<text class="s" x="300" y="444" text-anchor="middle">neither lists the other in its</text>
<text class="s" x="300" y="466" text-anchor="middle">history: concurrent, so keep both</text>
<path class="ln" d="M300 486 L300 510" marker-end="url(#ar)"/>
<rect class="boxa" x="20" y="514" width="560" height="132" rx="6"/>
<text class="k" x="40" y="540">ON BOTH DEVICES</text>
<text class="b" x="40" y="572">notes.md</text>
<text class="b am" x="560" y="572" text-anchor="end">(4, P)</text>
<text class="b" x="40" y="600">notes (conflict from Laptop).md</text>
<text class="b" x="560" y="600" text-anchor="end">(4, L)</text>
<text class="s" x="40" y="630">same clock: the higher device ID wins</text>
</svg>
