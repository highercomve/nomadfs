<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 722" role="img" aria-labelledby="t">
<title id="t">Joining a device with a one-time invite: the laptop shows a QR code that works once for 10 minutes; the new phone scans it or pastes the code. Only that code opens an encrypted channel, in which the two swap identities and addresses and the laptop sends the swarm key, which is never shown. Afterwards each trusts the other.</title>
