<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="t">
<title id="t">The mount: ~/NomadFS holds a folder per device with its shares, read-only and read from that device when opened, and Swarm, the swarm folder, which any program can write. It is a folder on Linux and macOS and a drive letter on Windows.</title>
