<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 580" role="img" aria-labelledby="t">
<title id="t">Pulling a file from multiple holders in parallel: read-ahead workers spread block requests across the home server and the phone in proportion to their speed</title>
<defs>
<style>
text { font-family: 'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; fill: #f2e8d8; }
.h { font-size: 18px; font-weight: 600; fill: #f5efe6; }
.b { font-size: 15px; }
.s { font-size: 13.5px; fill: #a99f8f; }
.k { font-size: 12px; letter-spacing: 1.6px; fill: #f6b042; }
.am { fill: #f6b042; } .oa { fill: #5ce1e6; } .di { fill: #a99f8f; } .du { fill: #6f6a63; } .cr { fill: #f5efe6; }
.box { fill: #1a2131; stroke: #f2e8d8; stroke-opacity: .22; stroke-width: 1.5; }
.boxa { fill: #f6b042; fill-opacity: .1; stroke: #f6b042; stroke-width: 1.6; }
.boxo { fill: #2ec4b6; fill-opacity: .1; stroke: #5ce1e6; stroke-width: 1.6; }
.boxd { fill: #10141f; stroke: #f2e8d8; stroke-opacity: .16; stroke-width: 1.3; }
.ln { stroke: #a99f8f; stroke-width: 1.6; fill: none; }
.lna { stroke: #f6b042; stroke-width: 1.8; fill: none; }
.lno { stroke: #5ce1e6; stroke-width: 1.8; fill: none; }
.lnf { stroke: #f2e8d8; stroke-opacity: .18; stroke-width: 1.3; fill: none; }
.dash { stroke-dasharray: 5 5; }
</style>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a99f8f"/></marker>
<marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f6b042"/></marker>
<marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5ce1e6"/></marker>
</defs>

<!-- Device Headers -->
<rect class="box" x="15" y="16" width="180" height="52" rx="6"/>
<text class="h" x="105" y="42" text-anchor="middle">Laptop</text>
<text class="s" x="105" y="59" text-anchor="middle">Reader (6 workers)</text>

<rect class="boxa" x="220" y="16" width="180" height="52" rx="6"/>
<text class="h am" x="310" y="42" text-anchor="middle">Home Server</text>
<text class="s" x="310" y="59" text-anchor="middle">Backup (Fast LAN)</text>

<rect class="boxo" x="425" y="16" width="180" height="52" rx="6"/>
<text class="h oa" x="515" y="42" text-anchor="middle">Phone</text>
<text class="s" x="515" y="59" text-anchor="middle">Author (Wi-Fi)</text>

<!-- Lifelines -->
<path class="lnf dash" d="M105 68 L105 450"/>
<path class="lnf dash" d="M310 68 L310 450"/>
<path class="lnf dash" d="M515 68 L515 450"/>

<!-- Context note -->
<text class="s" x="310" y="96" text-anchor="middle">both hold PXL_photo.jpg (holdersOf finds both)</text>

<!-- Request 1 & 2 in parallel -->
<path class="lna" d="M105 120 L302 140" marker-end="url(#ara)"/>
<text class="b am" x="195" y="125" text-anchor="middle">GET Block 0</text>

<path class="lno" d="M105 145 L507 175" marker-end="url(#aro)"/>
<text class="b oa" x="250" y="160" text-anchor="middle">GET Block 1</text>

<!-- Request 3 to Server -->
<path class="lna" d="M105 190 L302 210" marker-end="url(#ara)"/>
<text class="b am" x="195" y="195" text-anchor="middle">GET Block 2</text>

<!-- Server replies Block 0 -->
<path class="ln dash" d="M310 230 L113 250" marker-end="url(#ar)"/>
<text class="s" x="215" y="235" text-anchor="middle">Block 0 (rate: 45 MB/s ↑)</text>

<!-- Next block goes to Server -->
<path class="lna" d="M105 270 L302 290" marker-end="url(#ara)"/>
<text class="b am" x="195" y="275" text-anchor="middle">GET Block 3</text>

<!-- Phone replies Block 1 -->
<path class="ln dash" d="M515 295 L113 330" marker-end="url(#ar)"/>
<text class="s" x="360" y="310" text-anchor="middle">Block 1 (rate: 15 MB/s)</text>

<!-- Next block goes to Phone -->
<path class="lno" d="M105 350 L507 380" marker-end="url(#aro)"/>
<text class="b oa" x="360" y="360" text-anchor="middle">GET Block 4</text>

<!-- Server replies Block 2 -->
<path class="ln dash" d="M310 370 L113 390" marker-end="url(#ar)"/>
<text class="s" x="215" y="375" text-anchor="middle">Block 2</text>

<!-- Summary box -->
<rect class="boxd" x="20" y="455" width="580" height="108" rx="6"/>
<text class="k" x="35" y="480">DYNAMIC LOAD-BALANCED CHUNK FETCHING</text>
<text class="b" x="35" y="504">cost = (requests_in_flight + 1) / measured_rate</text>
<text class="s" x="35" y="528">• 6 workers spread blocks across all available holders in parallel</text>
<text class="s" x="35" y="548">• Every block is checked against its SHA-256 hash before local caching</text>
</svg>
