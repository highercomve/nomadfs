<extend template="base.shtml">
<head id="head">
	<title :text="$page.title.suffix(' · NomadFS docs')"></title>
</head>
<body id="body">
	<div class="docs">
		<aside class="sidebar">
			<nav>
				<h4>Start</h4>
				<a href="$site.page('docs').link()">Overview</a>
				<a href="$site.page('docs/getting-started').link()">Getting started</a>
				<a href="$site.page('docs/changelog').link()">Changelog</a>
				<h4>Using NomadFS</h4>
				<a href="$site.page('docs/shared-folders').link()">Shared folders &amp; mount</a>
				<a href="$site.page('docs/swarm-folder').link()">Swarm folder</a>
				<a href="$site.page('docs/connecting-devices').link()">Connecting devices</a>
			</nav>
		</aside>
		<main class="doc">
			<article class="prose">
				<p class="plate-label" :text="$page.custom.getOr('label', 'docs')"></p>
				<h1 :text="$page.title"></h1>
				<p class="doc-lead" :if="$page.description.len().gt(0)" :text="$page.description"></p>
				<div class="content" :html="$page.content()"></div>
			</article>
			<div class="doc-foot">
				<a class="edit-link" href="https://github.com/highercomve/nomadfs/tree/main/site/content/docs">Improve these docs on GitHub</a>
			</div>
		</main>
		<aside class="toc">
			<h4>On this page</h4>
			<div :html="$page.toc()"></div>
		</aside>
	</div>
</body>
