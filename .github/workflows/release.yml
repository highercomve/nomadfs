# A NomadFS release from a tag, like Ghostpen's and Oriel's: push vX.Y.Z
# (matching the version in nomadfs-gui/build.zig) and every platform is built
# in parallel, then one job signs the update manifests for all of them,
# writes the checksums, publishes the GitHub release with its notes from
# CHANGELOG.md, and the site is rebuilt so its download links list it.
#
#   linux-app    nomadfs-gui .AppImage, .deb, .rpm (Arch: GNOME 50's GTK/WebKit)
#   cross        command line (x86_64, aarch64 Linux; Windows), the Windows
#                app (installer and update payload), the Android APK (the
#                GitHub one: debug-signed, with its own update check)
#   macos        the macOS app (.dmg, and .app.tar.gz for the updater; signed
#                with NomadFS's identity) and command line (Apple silicon)
#   play         the Google Play .aab (-Dplay-store=true, upload key): an
#                artifact of the run, uploaded to internal testing if set up
#   release      latest.json, latest-cli.json, SHA256SUMS(-macos); publishes
#   site         redeploys the site (site.yml), which reads the new release
#
# Secrets: NOMADFS_UPDATE_KEY (signs the manifests the apps check),
# NOMADFS_ANDROID_DEBUG_KEYSTORE_BASE64 (the keystore every GitHub APK was
# signed with: another key and Android refuses the update),
# NOMADFS_PLAY_UPLOAD_KEYSTORE_BASE64 and NOMADFS_PLAY_UPLOAD_PASSWORD (the
# Play upload key, store/README.md), NOMADFS_MACOS_CERT_P12_BASE64,
# NOMADFS_MACOS_CERT_PASSWORD and NOMADFS_MACOS_SIGN_IDENTITY (the macOS
# signing identity), optionally PLAY_SERVICE_ACCOUNT_JSON (a service account
# with release access in Play Console).
#
# Re-run a tag with "Run workflow": a release that exists gets its files
# replaced.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and release (vX.Y.Z)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches every version field
        run: |
          v=$(sed -n 's/^ *const version = "\(.*\)";/\1/p' nomadfs-gui/build.zig | head -n1)
          [ "v$v" = "$TAG" ] || { echo "::error::$TAG doesn't match nomadfs-gui/build.zig ($v)"; exit 1; }
          for zon in build.zig.zon nomadfs-gui/build.zig.zon; do
            grep -q "\.version = \"$v\"" "$zon" || { echo "::error::$zon isn't at $v"; exit 1; }
          done
          grep -q "^pub const version = \"$v\";" src/node_info.zig || { echo "::error::src/node_info.zig isn't at $v"; exit 1; }
          IFS=. read -r major minor patch <<<"${v%%[-+]*}"
          code=$((major * 10000 + minor * 100 + patch))
          gradle=nomadfs-gui/android/app/build.gradle.kts
          grep -q "versionName = \"$v\"" "$gradle" && grep -q "versionCode = $code\$" "$gradle" ||
            { echo "::error::$gradle needs versionName = \"$v\" and versionCode = $code"; exit 1; }
          grep -q "^## $v " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $v' entry"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux-app:
    needs: version
    runs-on: ubuntu-latest
    container: ghcr.io/archlinux/archlinux:latest
    steps:
      - name: System packages
        run: >-
          pacman -Syu --noconfirm --needed git pkgconf gtk4 webkitgtk-6.0 wayland wayland-protocols
          libxkbcommon libx11 dbus squashfs-tools desktop-file-utils go
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: nfpm (for .deb and .rpm)
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Packages (.AppImage, .deb, .rpm)
        working-directory: nomadfs-gui
        # Baseline x86_64: without it Zig targets the runner's CPU.
        run: zig build package -Doptimize=ReleaseSafe -Dcpu=baseline
      - run: ls -la nomadfs-gui/zig-out/package
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            nomadfs-gui/zig-out/package/*.AppImage
            nomadfs-gui/zig-out/package/*.deb
            nomadfs-gui/zig-out/package/*.rpm
          if-no-files-found: error

  cross:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build tools (NSIS for the Windows installer)
        run: sudo apt-get update -q && sudo apt-get install -yq nsis libwayland-dev wayland-protocols pkg-config
      - name: Command line
        run: |
          mkdir -p dist
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-musl -Dcpu=baseline -p out/x86_64
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-musl -p out/aarch64
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dcpu=baseline -p out/windows
          cp out/x86_64/bin/nomadfs "dist/nomadfs-$V-x86_64-linux"
          cp out/aarch64/bin/nomadfs "dist/nomadfs-$V-aarch64-linux"
          cp out/windows/bin/nomadfs.exe "dist/nomadfs-$V-x86_64-windows.exe"
      - name: WebView2 loader (NuGet, as `oriel webview2` gets it)
        run: |
          ver=$(curl -fsSL https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json |
            jq -r '[.versions[] | select(test("-") | not)] | last')
          curl -fsSL -o "$RUNNER_TEMP/wv2.nupkg" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$ver/microsoft.web.webview2.$ver.nupkg"
          unzip -q -o "$RUNNER_TEMP/wv2.nupkg" 'runtimes/win-x64/native/WebView2Loader.dll' -d "$RUNNER_TEMP/wv2"
          echo "WEBVIEW2_LOADER=$RUNNER_TEMP/wv2/runtimes/win-x64/native/WebView2Loader.dll" >> "$GITHUB_ENV"
          echo "WebView2 $ver"
      - name: Windows app (installer and update payload)
        working-directory: nomadfs-gui
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dcpu=baseline -p ../out/gui-windows
          zig build package -Doptimize=ReleaseSafe -Dtarget=x86_64-windows-gnu -Dcpu=baseline \
            -Dwebview2-loader="$WEBVIEW2_LOADER" -p ../out/gui-windows
          cp "../out/gui-windows/package/nomadfs-gui-$V-setup.exe" "../dist/nomadfs-gui-$V-windows-x86_64-setup.exe"
          # What an installed app downloads to update itself: the executable alone.
          cp ../out/gui-windows/bin/nomadfs-gui.exe "../dist/nomadfs-gui-$V-x86_64-windows-update.exe"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform, build tools, NDK)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Signing key (the one every published APK carries)
        env:
          KEYSTORE: ${{ secrets.NOMADFS_ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE" ] || { echo "::error::NOMADFS_ANDROID_DEBUG_KEYSTORE_BASE64 is not set: an APK signed with another key can't update the installed app"; exit 1; }
          mkdir -p ~/.android && umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > ~/.android/debug.keystore
      - name: Android app
        working-directory: nomadfs-gui
        run: |
          zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux-android
          zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-linux-android -Dcpu=baseline
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk "../dist/nomadfs-$V.apk"
          rm -f ~/.android/debug.keystore
      - run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: cross
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    env:
      V: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Command line
        run: zig build -Doptimize=ReleaseSafe
      - name: Smoke test
        run: bash scripts/smoke.sh zig-out/bin/nomadfs
      # The same identity every release, so macOS keeps the app's
      # permissions across updates.
      - name: Import signing identity
        env:
          CERT: ${{ secrets.NOMADFS_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.NOMADFS_MACOS_CERT_PASSWORD }}
        run: |
          [ -n "$CERT" ] || { echo "::error::NOMADFS_MACOS_CERT_P12_BASE64 is not set"; exit 1; }
          umask 077
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/nomadfs.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/nomadfs.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/nomadfs.p12"
      - name: App
        working-directory: nomadfs-gui
        env:
          ORIEL_MACOS_SIGN_IDENTITY: ${{ secrets.NOMADFS_MACOS_SIGN_IDENTITY }}
        run: zig build package -Doptimize=ReleaseSafe
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
      - name: Check the app (signature; starts and stays up)
        working-directory: nomadfs-gui
        run: |
          app=$(find zig-out/package -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|Identifier'
          export HOME="$RUNNER_TEMP/apphome"; mkdir -p "$HOME"
          "$app"/Contents/MacOS/* > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          tail -30 "$RUNNER_TEMP/app.log"
          kill -0 "$pid"
          kill "$pid"
      - name: Collect
        run: |
          mkdir dist
          cp "$(find nomadfs-gui/zig-out/package -maxdepth 1 -name '*.dmg' | head -1)" "dist/nomadfs-gui-$V-macos-arm64.dmg"
          cp zig-out/bin/nomadfs "dist/nomadfs-$V-aarch64-macos"
          # The installed app's update payload: the signed bundle itself.
          app=$(find nomadfs-gui/zig-out/package -maxdepth 1 -name '*.app' | head -1)
          tar -C "$(dirname "$app")" -czf "dist/nomadfs-gui-$V-macos-arm64.app.tar.gz" "$(basename "$app")"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # The Google Play build (store/README.md): -Dplay-store=true (Play updates
  # it, so no update check or APK download), an .aab signed with the upload
  # key. Kept as this run's artifact, never on the GitHub release; uploaded
  # to the internal testing track when PLAY_SERVICE_ACCOUNT_JSON is set.
  play:
    needs: version
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.version.outputs.version }}
      NDK_VERSION: 28.2.13676358
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK (platform, build tools, NDK)
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "ndk;$NDK_VERSION" >/dev/null
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Upload key (nomadfs-upload)
        env:
          KEYSTORE: ${{ secrets.NOMADFS_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.NOMADFS_PLAY_UPLOAD_PASSWORD }}
        run: |
          [ -n "$KEYSTORE" ] && [ -n "$PASSWORD" ] ||
            { echo "::error::NOMADFS_PLAY_UPLOAD_KEYSTORE_BASE64 and NOMADFS_PLAY_UPLOAD_PASSWORD must be set"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/play-upload.p12"
          {
            echo "ORIEL_ANDROID_KEYSTORE=$RUNNER_TEMP/play-upload.p12"
            echo "ORIEL_ANDROID_KEY_ALIAS=nomadfs-upload"
            echo "ORIEL_ANDROID_KEYSTORE_PASSWORD=$PASSWORD"
            echo "ORIEL_ANDROID_KEY_PASSWORD=$PASSWORD"
          } >> "$GITHUB_ENV"
      - name: App bundle (.aab)
        working-directory: nomadfs-gui
        run: |
          zig build -Doptimize=ReleaseSafe -Dplay-store=true -Dtarget=aarch64-linux-android
          zig build -Doptimize=ReleaseSafe -Dplay-store=true -Dtarget=x86_64-linux-android -Dcpu=baseline
          (cd android && ./gradlew --no-daemon bundleRelease)
          rm -f "$RUNNER_TEMP/play-upload.p12"
          mkdir -p ../play
          cp android/app/build/outputs/bundle/release/app-release.aab "../play/nomadfs-$V-play.aab"
          ls -la ../play
      - uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: play/*.aab
          if-no-files-found: error
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY_ACCOUNT == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.foreachdeveloper.nomadfs
          releaseFiles: play/nomadfs-${{ env.V }}-play.aab
          releaseName: ${{ env.V }}
          track: internal
          status: completed

  release:
    needs: [version, linux-app, cross, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -yq libwayland-dev wayland-protocols pkg-config
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assets
        # The release's files only: the top-level files of each artifact
        # (packaging can leave directories next to them, like brand/).
        run: |
          find artifacts -maxdepth 3 | sort
          mkdir -p assets
          find artifacts/cross artifacts/linux-app artifacts/macos -maxdepth 1 -type f -exec cp -t assets {} +
          ls -la assets
      - name: Update manifests (latest.json, latest-cli.json)
        env:
          UPDATE_KEY: ${{ secrets.NOMADFS_UPDATE_KEY }}
        run: |
          [ -n "$UPDATE_KEY" ] || { echo "::error::NOMADFS_UPDATE_KEY is not set"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$UPDATE_KEY" > "$key"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir -p "$RUNNER_TEMP/m" "$RUNNER_TEMP/mcli"
          sign() { # <asset> <target> <format> <app id suffix> <out dir>
            (cd nomadfs-gui && zig build sign-update -- "../assets/$1" --app-id "com.foreachdeveloper.nomadfs$4" \
              --version "$V" --target "$2" --format "$3" --url "$base/$1" --key "$key" --out "$5/update-$2.json")
          }
          sign "nomadfs-gui-$V-x86_64.AppImage" x86_64-linux appimage "" "$RUNNER_TEMP/m"
          sign "nomadfs-gui-$V-x86_64-windows-update.exe" x86_64-windows raw "" "$RUNNER_TEMP/m"
          # One APK for both ABIs. The app opens its download; Android installs it.
          sign "nomadfs-$V.apk" aarch64-android raw "" "$RUNNER_TEMP/m"
          sign "nomadfs-$V.apk" x86_64-android raw "" "$RUNNER_TEMP/m"
          sign "nomadfs-gui-$V-macos-arm64.app.tar.gz" aarch64-macos app.tar.gz "" "$RUNNER_TEMP/m"
          # The command line node: its own app id, so the app's manifest
          # can't replace it with an AppImage (both are x86_64-linux).
          sign "nomadfs-$V-x86_64-linux" x86_64-linux raw .cli "$RUNNER_TEMP/mcli"
          sign "nomadfs-$V-aarch64-linux" aarch64-linux raw .cli "$RUNNER_TEMP/mcli"
          sign "nomadfs-$V-x86_64-windows.exe" x86_64-windows raw .cli "$RUNNER_TEMP/mcli"
          sign "nomadfs-$V-aarch64-macos" aarch64-macos raw .cli "$RUNNER_TEMP/mcli"
          rm -f "$key"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd nomadfs-gui && zig build combine-manifests -- "$RUNNER_TEMP"/m/update-*.json --pub-date "$now" --out ../assets/latest.json)
          (cd nomadfs-gui && zig build combine-manifests -- "$RUNNER_TEMP"/mcli/update-*.json --pub-date "$now" --out ../assets/latest-cli.json)
          jq -r '.platforms | keys | join(", ")' assets/latest.json assets/latest-cli.json
      # SHA256SUMS: every file. SHA256SUMS-macos: the macOS ones, which
      # install.sh reads on a Mac.
      - name: Checksums
        run: |
          (cd assets && find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum --) > SHA256SUMS
          (cd assets && sha256sum -- *-macos*) > SHA256SUMS-macos
          mv SHA256SUMS SHA256SUMS-macos assets/
          cat assets/SHA256SUMS
      - name: Release notes (CHANGELOG.md)
        run: |
          awk -v v="$V" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no notes for $V in CHANGELOG.md"; exit 1; }
          title=$(git log -1 --format=%s HEAD | sed -n 's/^Release [0-9.]*: //p')
          echo "TITLE=NomadFS $V${title:+: $title}" >> "$GITHUB_ENV"
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITLE }}
          body_path: notes.md
          files: assets/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: false

  # The site's download links come from the latest release: rebuild it. A
  # release published with the workflow's token starts no other workflow,
  # a workflow_dispatch does.
  site:
    needs: release
    if: ${{ !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rebuild the site
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
