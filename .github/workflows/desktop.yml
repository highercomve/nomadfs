# macOS and Windows: build and test on real machines, and attach the
# macOS app and command line to a published release (scripts/release.sh
# builds the Linux, Android and Windows assets locally).
#
#   macOS:   the app (.dmg, signed with NomadFS's persistent self-signed
#            identity so macOS keeps its permissions across updates) and the
#            command line node (Apple silicon).
#   Windows: the command line smoke test, then the release's installer is
#            installed silently and the app must stay up.
name: Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to test and attach to (default the latest)
        required: false

permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  # The WebDAV server's check that a connection comes from this user,
  # with another user (sudo -u nobody) refused.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Command line
        run: zig build -Doptimize=ReleaseSafe
      - name: WebDAV server (curl; another user refused)
        timeout-minutes: 5
        run: bash scripts/webdav-smoke.sh zig-out/bin/nomadfs serve
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Command line
        run: zig build -Doptimize=ReleaseSafe
      - name: Smoke test
        run: bash scripts/smoke.sh zig-out/bin/nomadfs
      - name: Platform tests (disk, addresses)
        run: zig test src/node_info.zig
      - name: WebDAV mount (mount_webdav, then cp, mv, rm through it)
        timeout-minutes: 5
        run: bash scripts/webdav-smoke.sh zig-out/bin/nomadfs mount
      - name: Import signing identity
        env:
          CERT: ${{ secrets.NOMADFS_MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.NOMADFS_MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/nomadfs.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security import "$RUNNER_TEMP/nomadfs.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/nomadfs.p12"
      - name: App
        working-directory: nomadfs-gui
        env:
          ORIEL_MACOS_SIGN_IDENTITY: ${{ secrets.NOMADFS_MACOS_SIGN_IDENTITY }}
        run: zig build package -Doptimize=ReleaseSafe
      - name: Check the app
        working-directory: nomadfs-gui
        run: |
          app=$(find zig-out/package -maxdepth 1 -name '*.app' | head -1)
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|Identifier'
          # Starts and stays up (its own HOME: a fresh device).
          export HOME="$RUNNER_TEMP/apphome"; mkdir -p "$HOME"
          "$app"/Contents/MacOS/* > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 20
          cat "$RUNNER_TEMP/app.log" | tail -30
          kill -0 "$pid"
          kill "$pid"
      - name: Collect
        run: |
          v=$(sed -n 's/^ *const version = "\(.*\)";/\1/p' nomadfs-gui/build.zig | head -n1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          mkdir dist
          cp "$(find nomadfs-gui/zig-out/package -maxdepth 1 -name '*.dmg' | head -1)" "dist/nomadfs-gui-$v-macos-arm64.dmg"
          cp zig-out/bin/nomadfs "dist/nomadfs-$v-aarch64-macos"
          # The installed app's update payload: the signed bundle itself.
          app=$(find nomadfs-gui/zig-out/package -maxdepth 1 -name '*.app' | head -1)
          tar -C "$(dirname "$app")" -czf "dist/nomadfs-gui-$v-macos-arm64.app.tar.gz" "$(basename "$app")"
          (cd dist && shasum -a 256 * > SHA256SUMS-macos)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/
      - name: Attach to the release, with signed update entries
        if: env.TAG != ''
        env:
          UPDATE_KEY: ${{ secrets.NOMADFS_UPDATE_KEY }}
        run: |
          gh release upload "$TAG" dist/* --clobber
          umask 077
          key="$RUNNER_TEMP/update.key"
          printf '%s\n' "$UPDATE_KEY" > "$key"
          base="https://github.com/highercomve/nomadfs/releases/download/$TAG"
          mkdir -p "$RUNNER_TEMP/m"
          sign() { # <asset> <app id> <format> <out>
            (cd nomadfs-gui && zig build sign-update -- "../dist/$1" --app-id "$2" --version "$VERSION" \
              --target aarch64-macos --format "$3" --url "$base/$1" --key "$key" --out "$4")
          }
          sign "nomadfs-gui-$VERSION-macos-arm64.app.tar.gz" com.foreachdeveloper.nomadfs app.tar.gz "$RUNNER_TEMP/m/app.json"
          sign "nomadfs-$VERSION-aarch64-macos" com.foreachdeveloper.nomadfs.cli raw "$RUNNER_TEMP/m/cli.json"
          rm -f "$key"
          # Each platform's entry is signed on its own: add macOS's to the release's manifests.
          cd "$RUNNER_TEMP/m"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p latest.json -p latest-cli.json
          jq --slurpfile e app.json '.platforms["aarch64-macos"] = $e[0]' latest.json > latest.json.new && mv latest.json.new latest.json
          jq --slurpfile e cli.json '.platforms["aarch64-macos"] = $e[0]' latest-cli.json > latest-cli.json.new && mv latest-cli.json.new latest-cli.json
          jq -r '.platforms | keys | join(", ")' latest.json latest-cli.json
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" latest.json latest-cli.json --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Command line
        run: zig build -Doptimize=ReleaseSafe
      - name: Smoke test
        run: bash scripts/smoke.sh zig-out/bin/nomadfs.exe
      - name: Platform tests (disk, addresses)
        run: zig test src/node_info.zig
      - name: WebDAV server (curl)
        timeout-minutes: 5
        run: bash scripts/webdav-smoke.sh zig-out/bin/nomadfs.exe serve
      - name: WebView2 runtime
        shell: pwsh
        run: |
          # Windows 10 and 11 have it; the runner's Windows Server may not.
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "WebView2 $((Get-ItemProperty $key).pv)"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'webview2.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          Start-Process $setup -ArgumentList '/silent','/install' -Wait
      - name: Install the release's app and start it
        timeout-minutes: 10
        shell: pwsh
        run: |
          $tag = if ($env:TAG) { $env:TAG } else { gh release view --json tagName -q .tagName }
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          gh release download $tag -p '*-setup.exe' -D $rel
          if ($LASTEXITCODE -ne 0) {
            # A manual run on main before the first Windows release.
            if (-not $env:TAG) { "no Windows installer in $tag yet: skipped"; exit 0 }
            exit 1
          }
          $setup = (Get-ChildItem $rel -Filter '*-setup.exe' | Select-Object -First 1).FullName
          "installer: $setup"
          $p = Start-Process $setup -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(180000)) {
            "the installer is still running after 3 minutes:"
            Get-Process | Where-Object { $_.MainWindowTitle } | Format-Table Id, Name, MainWindowTitle -AutoSize | Out-String -Width 200
            Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id } | Format-Table ProcessId, Name, CommandLine -AutoSize | Out-String -Width 300
            $p.Kill(); exit 1
          }
          "installer exit code: $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'nomadfs-gui.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { "not installed"; exit 1 }
          "installed: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Format-Table Name, Length -AutoSize | Out-String
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'apphome'; New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'app.log'
          $app = Start-Process $exe.FullName -PassThru -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          Start-Sleep 20
          Get-Content $log, "$log.err" -Tail 30 -ErrorAction SilentlyContinue
          if ($app.HasExited) { "the app exited with $($app.ExitCode)"; exit 1 }
          "the app is running"
          Stop-Process -Id $app.Id -Force
