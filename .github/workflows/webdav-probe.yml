name: WebDAV probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: try -i and URL credentials
        run: |
          cat > /tmp/dav.py <<'PY'
          import base64, sys
          from http.server import BaseHTTPRequestHandler, HTTPServer
          OK = "Basic " + base64.b64encode(b"nomadfs:pass").decode()
          class H(BaseHTTPRequestHandler):
              def handle_one_request(self):
                  super().handle_one_request()
              def do_any(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  if n: self.rfile.read(n)
                  auth = self.headers.get("Authorization")
                  print("REQ", self.command, self.path, "auth=", auth, flush=True)
                  if self.command == "OPTIONS":
                      self.send_response(200); self.send_header("DAV", "1, 2"); self.send_header("Content-Length", "0"); self.end_headers(); return
                  if auth != OK:
                      self.send_response(401); self.send_header("WWW-Authenticate", 'Basic realm="NomadFS"'); self.send_header("Content-Length", "0"); self.end_headers(); return
                  body = b'<?xml version="1.0" encoding="utf-8"?><D:multistatus xmlns:D="DAV:"><D:response><D:href>/</D:href><D:propstat><D:prop><D:resourcetype><D:collection/></D:resourcetype></D:prop><D:status>HTTP/1.1 200 OK</D:status></D:propstat></D:response></D:multistatus>'
                  self.send_response(207); self.send_header("Content-Type", "application/xml"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
              do_GET = do_PROPFIND = do_LOCK = do_UNLOCK = do_PUT = do_HEAD = do_any
              def log_message(self, *a): pass
          HTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          PY
          python3 /tmp/dav.py 47998 > /tmp/dav.log 2>&1 &
          sleep 2
          mkdir -p /tmp/mi /tmp/mu
          echo "== -i with stdin"
          printf 'nomadfs\npass\n' | /sbin/mount_webdav -S -i -v Probe http://127.0.0.1:47998/ /tmp/mi < /dev/stdin; echo "exit $?"
          mount | grep /tmp/mi || true
          /sbin/umount /tmp/mi 2>/dev/null || true
          echo "== -i, script with a tty"
          printf 'nomadfs\npass\n' | script -q /dev/null /sbin/mount_webdav -S -i -v Probe http://127.0.0.1:47998/ /tmp/mi; echo "exit $?"
          mount | grep /tmp/mi || true
          /sbin/umount /tmp/mi 2>/dev/null || true
          echo "== credentials in the URL"
          /sbin/mount_webdav -S -v Probe http://nomadfs:pass@127.0.0.1:47998/ /tmp/mu; echo "exit $?"
          mount | grep /tmp/mu || true
          /sbin/umount /tmp/mu 2>/dev/null || true
          echo "== server log"; cat /tmp/dav.log
