name: WebDAV probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: man page and usage
        run: |
          man mount_webdav | col -b | sed -n '1,200p' || true
          /sbin/mount_webdav 2>&1 | head -20 || true
          strings /sbin/mount_webdav | grep -i -E 'auth|user|pass|fd' | head -40 || true
      - name: try login formats
        run: |
          try() {
            name=$1; data=$2
            mkdir -p /tmp/m_$name
            rm -f /tmp/req_$name
            (nc -l 127.0.0.1 47999 > /tmp/req_$name) & ncpid=$!
            sleep 1
            printf "$data" | /sbin/mount_webdav -S -a 0 -v Probe http://127.0.0.1:47999/ /tmp/m_$name; echo "$name: exit $?"
            sleep 1; kill $ncpid 2>/dev/null || true
            echo "$name request:"; head -c 300 /tmp/req_$name; echo
          }
          try le '\x07\x00\x00\x00nomadfs\x04\x00\x00\x00pass'
          try be '\x00\x00\x00\x07nomadfs\x00\x00\x00\x04pass'
          try nl 'nomadfs\npass\n'
          try nul 'nomadfs\x00pass\x00'
